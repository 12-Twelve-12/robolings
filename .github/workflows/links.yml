name: Links

# Only the links between files in the repository are checked, and that needs
# no network, so this never fails for a reason unrelated to the change.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**.md"
      - "tools/check_links.py"
      - ".github/workflows/links.yml"

permissions:
  contents: read

jobs:
  links:
    if: github.repository == '12-Twelve-12/robolings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_links.py
